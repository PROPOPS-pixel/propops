<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — PropOps.Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --navy: #0f172a;
            --amber: #f59e0b;
            --amber-dark: #d97706;
            --border: #e2e8f0;
            --bg-off: #f8fafc;
            --muted: #94a3b8;
            --slate: #334155;
            --green: #059669;
            --green-bg: #d1fae5;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-off);
            color: var(--navy);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
        }
        .card-header {
            background: var(--navy);
            padding: 24px 40px;
            display: flex;
            align-items: center;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .logo img { height: 32px; width: auto; display: block; }

        .card-body { padding: 32px 40px 36px; }
        h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.35rem; }
        .subtitle { font-size: 0.875rem; color: var(--slate); line-height: 1.6; margin-bottom: 1.75rem; }
        label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--navy); margin-bottom: 0.35rem; }
        input[type="email"] {
            width: 100%;
            padding: 0.72rem 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.92rem;
            font-family: inherit;
            color: var(--navy);
            outline: none;
            transition: border-color 0.15s;
            margin-bottom: 1.1rem;
        }
        input:focus { border-color: var(--amber); }
        .btn {
            width: 100%;
            padding: 0.85rem;
            background: var(--navy);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover { background: #1e293b; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .success {
            display: none;
            padding: 0.9rem 1rem;
            background: var(--green-bg);
            color: var(--green);
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .error {
            display: none;
            padding: 0.72rem 1rem;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .back-link {
            display: inline-block;
            margin-top: 1.4rem;
            font-size: 0.82rem;
            color: var(--amber-dark);
            font-weight: 600;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <a href="/" class="logo" aria-label="PropOps.Pro — Home">
            <img src="/logo-white.svg" alt="PropOps.Pro" height="32">
        </a>
    </div>

    <div class="card-body">
        <h1>Reset your password</h1>
        <p class="subtitle">Enter your email and we'll send you a link to set a new password.</p>

        <div class="success" id="successMsg"></div>
        <div class="error" id="errorMsg"></div>

        <form id="forgotForm" onsubmit="handleForgot(event)">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
            <button type="submit" class="btn" id="submitBtn">Send reset link</button>
        </form>

        <a href="/login" class="back-link">&larr; Back to login</a>
    </div>
</div>

<script>
async function handleForgot(e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var btn = document.getElementById('submitBtn');
    var successEl = document.getElementById('successMsg');
    var errorEl = document.getElementById('errorMsg');

    if (!email) return;

    btn.disabled = true;
    btn.textContent = 'Sending\u2026';
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    try {
        var res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });
        var data = await res.json();

        // Always show success message (don't reveal if email exists)
        successEl.textContent = 'If an account exists with that email, we\u2019ve sent a password reset link. Check your inbox (and spam folder).';
        successEl.style.display = 'block';
        document.getElementById('forgotForm').style.display = 'none';
    } catch (err) {
        errorEl.textContent = 'Network error \u2014 please try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Send reset link';
    }
}
</script>

</body>
</html>
