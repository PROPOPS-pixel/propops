<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropOps Admin — Billing Issues</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --midnight: #0a0e1a;
      --deep: #111827;
      --surface: #1a2035;
      --surface-hover: #1f2742;
      --amber: #f0a500;
      --amber-light: #fbbf24;
      --amber-glow: rgba(240,165,0,0.12);
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --text-bright: #ffffff;
      --border: rgba(255,255,255,0.06);
      --green: #10b981;
      --green-glow: rgba(16,185,129,0.15);
      --red: #ef4444;
      --red-glow: rgba(239,68,68,0.12);
      --orange: #f97316;
      --orange-glow: rgba(249,115,22,0.12);
      --blue: #3b82f6;
      --blue-glow: rgba(59,130,246,0.12);
      --purple: #8b5cf6;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--midnight);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Nav ── */
    .nav {
      background: var(--deep);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--text-bright);
      text-decoration: none;
    }
    .logo span { color: var(--amber); }
    .nav-badge {
      font-size: 0.7rem;
      background: var(--red-glow);
      color: var(--red);
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid rgba(239,68,68,0.2);
    }

    /* ── Layout ── */
    .page { max-width: 1200px; margin: 0 auto; padding: 2rem; }

    .page-header {
      margin-bottom: 2rem;
    }
    .page-header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 0.35rem;
    }
    .page-header p { color: var(--text-dim); font-size: 0.9rem; }

    /* ── Auth gate ── */
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 420px;
      margin: 4rem auto;
    }
    .auth-card h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      color: var(--text-bright);
      margin-bottom: 1rem;
    }
    .auth-card input {
      width: 100%;
      background: var(--deep);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 0.9rem;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      font-family: monospace;
    }
    .auth-card input:focus { outline: none; border-color: var(--amber); }
    .btn-primary {
      width: 100%;
      background: var(--amber);
      color: #0a0e1a;
      font-weight: 700;
      font-size: 0.9rem;
      border: none;
      border-radius: 8px;
      padding: 0.65rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-sm {
      background: var(--surface-hover);
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-sm:hover { border-color: var(--amber); color: var(--amber); }
    .btn-danger {
      background: var(--red-glow);
      color: var(--red);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }

    /* ── Stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .stat-card .label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.3rem; }
    .stat-card .value { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--text-bright); }
    .stat-card.red .value { color: var(--red); }
    .stat-card.orange .value { color: var(--orange); }
    .stat-card.purple .value { color: var(--purple); }

    /* ── Actions bar ── */
    .actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .actions-bar .left { display: flex; gap: 0.6rem; align-items: center; }
    .last-refresh { font-size: 0.78rem; color: var(--text-dim); }

    /* ── Table ── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: var(--deep);
      color: var(--text-dim);
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface-hover); }
    tbody td {
      padding: 0.9rem 1rem;
      font-size: 0.85rem;
      vertical-align: middle;
    }
    .td-name { font-weight: 500; color: var(--text-bright); }
    .td-email { color: var(--text-dim); font-size: 0.82rem; }
    .td-mono { font-family: monospace; font-size: 0.8rem; color: var(--text-dim); }

    /* ── Status badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.73rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-red    { background: var(--red-glow);    color: var(--red);    border: 1px solid rgba(239,68,68,0.2); }
    .badge-orange { background: var(--orange-glow); color: var(--orange); border: 1px solid rgba(249,115,22,0.2); }
    .badge-purple { background: rgba(139,92,246,0.12); color: var(--purple); border: 1px solid rgba(139,92,246,0.2); }
    .badge-blue   { background: var(--blue-glow);   color: var(--blue);   border: 1px solid rgba(59,130,246,0.2); }
    .badge-amber  { background: var(--amber-glow);  color: var(--amber);  border: 1px solid rgba(240,165,0,0.2); }

    /* ── Grace countdown ── */
    .grace-bar-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .grace-bar { height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; width: 80px; flex-shrink: 0; }
    .grace-fill { height: 100%; border-radius: 3px; background: var(--orange); transition: width 0.3s; }
    .grace-label { font-size: 0.78rem; color: var(--text-dim); white-space: nowrap; }
    .grace-expired { font-size: 0.78rem; color: var(--red); font-weight: 600; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim);
    }
    .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.5; }
    .empty h3 { color: var(--text); margin-bottom: 0.35rem; font-family: 'Outfit', sans-serif; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-size: 0.85rem;
      color: var(--text);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      z-index: 9999;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.25s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-color: rgba(16,185,129,0.3); color: var(--green); }
    .toast.error   { border-color: rgba(239,68,68,0.3);  color: var(--red);   }

    /* ── Loading ── */
    .loading { text-align: center; padding: 3rem; color: var(--text-dim); font-size: 0.9rem; }
    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #dashboard { display: none; }
    #auth-gate  { display: block; }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/dashboard" class="logo">Prop<span>Ops</span></a>
  <span class="nav-badge">Admin — Billing</span>
</nav>

<!-- Auth gate -->
<div id="auth-gate">
  <div class="auth-card">
    <h2>Admin Access</h2>
    <p style="color:var(--text-dim);font-size:0.85rem;margin-bottom:1.25rem;">Enter your admin token to view billing issues.</p>
    <input type="password" id="token-input" placeholder="Admin token" autocomplete="off">
    <button class="btn-primary" onclick="authenticate()">Access Dashboard</button>
    <div id="auth-error" style="color:var(--red);font-size:0.82rem;margin-top:0.75rem;display:none;"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="page">
    <div class="page-header">
      <h1>Billing Issues</h1>
      <p>Agents with payment failures, cancellations, or expired grace periods.</p>
    </div>

    <div class="stats-row" id="stats-row">
      <div class="stat-card red">
        <div class="label">Payment Failed</div>
        <div class="value" id="stat-failed">—</div>
      </div>
      <div class="stat-card orange">
        <div class="label">Cancelled</div>
        <div class="value" id="stat-cancelled">—</div>
      </div>
      <div class="stat-card purple">
        <div class="label">Suspended</div>
        <div class="value" id="stat-suspended">—</div>
      </div>
      <div class="stat-card">
        <div class="label">In Grace Period</div>
        <div class="value" id="stat-grace">—</div>
      </div>
    </div>

    <div class="actions-bar">
      <div class="left">
        <button class="btn-sm" onclick="loadData()">↻ Refresh</button>
        <button class="btn-danger" onclick="expireGracePeriods()" id="btn-expire">⚠ Expire Overdue Grace Periods</button>
        <span class="last-refresh" id="last-refresh"></span>
      </div>
    </div>

    <div id="table-area">
      <div class="loading"><span class="spinner"></span> Loading...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let adminToken = '';

function showToast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3500);
}

function authenticate() {
  const val = document.getElementById('token-input').value.trim();
  if (!val) return;
  adminToken = val;
  // Try to load — if it fails (401) show error
  loadData(true);
}

async function loadData(isAuthAttempt = false) {
  try {
    const res = await fetch(`/api/admin/payment-issues?token=${encodeURIComponent(adminToken)}`);
    if (res.status === 401) {
      if (isAuthAttempt) {
        const errEl = document.getElementById('auth-error');
        errEl.textContent = 'Invalid admin token.';
        errEl.style.display = 'block';
      } else {
        showToast('Session expired — reload page', 'error');
      }
      return;
    }

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    if (isAuthAttempt) {
      // Switch to dashboard
      document.getElementById('auth-gate').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
    }

    renderDashboard(data);
  } catch (err) {
    if (isAuthAttempt) {
      const errEl = document.getElementById('auth-error');
      errEl.textContent = 'Error: ' + err.message;
      errEl.style.display = 'block';
    } else {
      showToast('Failed to load data: ' + err.message, 'error');
    }
  }
}

function renderDashboard(data) {
  const users = data.users || [];
  const now = new Date();

  // Stats
  const failed    = users.filter(u => u.subscription_status === 'payment_failed').length;
  const cancelled = users.filter(u => u.subscription_status === 'cancelled').length;
  const suspended = users.filter(u => u.subscription_status === 'suspended').length;
  const inGrace   = users.filter(u => u.in_grace_period).length;

  document.getElementById('stat-failed').textContent    = failed;
  document.getElementById('stat-cancelled').textContent = cancelled;
  document.getElementById('stat-suspended').textContent = suspended;
  document.getElementById('stat-grace').textContent     = inGrace;

  document.getElementById('last-refresh').textContent = 'Last refresh: ' + new Date().toLocaleTimeString('en-AU');

  // Table
  const area = document.getElementById('table-area');

  if (users.length === 0) {
    area.innerHTML = `
      <div class="table-wrap">
        <div class="empty">
          <div class="empty-icon">✅</div>
          <h3>All clear</h3>
          <p>No agents with payment issues.</p>
        </div>
      </div>`;
    return;
  }

  const rows = users.map(u => {
    const statusBadge = statusBadgeHtml(u.subscription_status);
    const gracePart   = graceHtml(u);
    const eventLabel  = u.suspension_event
      ? `<span class="td-mono">${esc(u.suspension_event)}</span>`
      : '<span style="color:var(--text-dim)">—</span>';
    const reasonLabel = u.cancellation_reason
      ? `<span class="td-mono" title="${esc(u.cancellation_reason)}">${esc(truncate(u.cancellation_reason, 36))}</span>`
      : '<span style="color:var(--text-dim)">—</span>';
    const dateLabel = u.cancelled_at
      ? formatDate(u.cancelled_at)
      : formatDate(u.updated_at);

    return `<tr>
      <td>
        <div class="td-name">${esc(u.name || 'No name')}</div>
        <div class="td-email">${esc(u.email)}</div>
      </td>
      <td>${statusBadge}</td>
      <td>${eventLabel}</td>
      <td>${reasonLabel}</td>
      <td>${gracePart}</td>
      <td style="color:var(--text-dim);font-size:0.8rem">${dateLabel}</td>
    </tr>`;
  }).join('');

  area.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Agent</th>
            <th>Status</th>
            <th>Event</th>
            <th>Reason</th>
            <th>Grace Period</th>
            <th>Event Date</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function statusBadgeHtml(status) {
  const map = {
    payment_failed: ['badge-red',    '💳 Payment Failed'],
    cancelled:      ['badge-orange', '✖ Cancelled'],
    suspended:      ['badge-purple', '⛔ Suspended'],
    past_due:       ['badge-amber',  '⚠ Past Due'],
  };
  const [cls, label] = map[status] || ['badge-blue', status];
  return `<span class="badge ${cls}">${label}</span>`;
}

function graceHtml(u) {
  if (u.subscription_status === 'suspended') {
    return '<span class="grace-expired">AI responses stopped</span>';
  }
  if (!u.grace_period_ends_at) {
    return '<span style="color:var(--text-dim);font-size:0.78rem">None</span>';
  }
  const days = parseFloat(u.grace_days_remaining);
  if (days <= 0) {
    return '<span class="grace-expired">Expired</span>';
  }
  const pct = Math.min(100, (days / 7) * 100);
  return `<div class="grace-bar-wrap">
    <div class="grace-bar"><div class="grace-fill" style="width:${pct.toFixed(0)}%"></div></div>
    <span class="grace-label">${days} days left</span>
  </div>`;
}

function formatDate(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch { return iso; }
}

function truncate(str, max) {
  if (!str) return '';
  return str.length > max ? str.slice(0, max) + '…' : str;
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function expireGracePeriods() {
  const btn = document.getElementById('btn-expire');
  btn.disabled = true;
  btn.textContent = 'Processing…';
  try {
    const res = await fetch(`/api/admin/expire-grace-periods?token=${encodeURIComponent(adminToken)}`, { method: 'POST' });
    const data = await res.json();
    if (data.success) {
      showToast(`${data.suspended_count} user(s) suspended`, data.suspended_count > 0 ? 'success' : 'success');
      loadData();
    } else {
      showToast('Error: ' + data.message, 'error');
    }
  } catch (err) {
    showToast('Request failed: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '⚠ Expire Overdue Grace Periods';
  }
}

// Enter key on token input
document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') authenticate();
});

// Auto-refresh every 60 seconds when on dashboard
setInterval(() => {
  if (document.getElementById('dashboard').style.display !== 'none') {
    loadData();
  }
}, 60000);
</script>
</body>
</html>
