<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password — PropOps.Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --navy: #0f172a;
            --amber: #f59e0b;
            --amber-dark: #d97706;
            --border: #e2e8f0;
            --bg-off: #f8fafc;
            --muted: #94a3b8;
            --slate: #334155;
            --green: #059669;
            --green-bg: #d1fae5;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-off);
            color: var(--navy);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
        }
        .card-header {
            background: var(--navy);
            padding: 24px 40px;
            display: flex;
            align-items: center;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .logo img { height: 32px; width: auto; display: block; }

        .card-body { padding: 32px 40px 36px; }
        h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.35rem; }
        .subtitle { font-size: 0.875rem; color: var(--slate); line-height: 1.6; margin-bottom: 1.75rem; }
        label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--navy); margin-bottom: 0.35rem; }
        input[type="password"] {
            width: 100%;
            padding: 0.72rem 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.92rem;
            font-family: inherit;
            color: var(--navy);
            outline: none;
            transition: border-color 0.15s;
            margin-bottom: 1.1rem;
        }
        input:focus { border-color: var(--amber); }
        .btn {
            width: 100%;
            padding: 0.85rem;
            background: var(--navy);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover { background: #1e293b; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .error {
            display: none;
            padding: 0.72rem 1rem;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .error-banner {
            display: none;
            padding: 0.72rem 1rem;
            background: #fef3c7;
            color: #92400e;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .pw-hint {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: -0.7rem;
            margin-bottom: 1.1rem;
        }
        .back-link {
            display: inline-block;
            margin-top: 1.4rem;
            font-size: 0.82rem;
            color: var(--amber-dark);
            font-weight: 600;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <a href="/" class="logo" aria-label="PropOps.Pro — Home">
            <img src="/logo-white.svg" alt="PropOps.Pro" height="32">
        </a>
    </div>

    <div class="card-body">
        <div class="error-banner" id="errorBanner"></div>

        <h1>Set new password</h1>
        <p class="subtitle">Choose a new password for your account.</p>

        <div class="error" id="formError"></div>

        <form id="resetForm" onsubmit="handleReset(event)">
            <label for="password">New password</label>
            <input type="password" id="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
            <p class="pw-hint">Minimum 8 characters</p>

            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat your password" required minlength="8" autocomplete="new-password">

            <button type="submit" class="btn" id="submitBtn">Set password</button>
        </form>

        <a href="/login" class="back-link">&larr; Back to login</a>
    </div>
</div>

<script>
// Extract token from URL
var params = new URLSearchParams(window.location.search);
var token = params.get('token');

if (!token) {
    document.getElementById('errorBanner').textContent = 'Invalid or missing reset link. Please request a new one.';
    document.getElementById('errorBanner').style.display = 'block';
    document.getElementById('resetForm').style.display = 'none';
}

async function handleReset(e) {
    e.preventDefault();
    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirmPassword').value;
    var btn = document.getElementById('submitBtn');
    var errorEl = document.getElementById('formError');

    errorEl.style.display = 'none';

    if (password.length < 8) {
        errorEl.textContent = 'Password must be at least 8 characters.';
        errorEl.style.display = 'block';
        return;
    }

    if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Setting password\u2026';

    try {
        var res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, password: password })
        });
        var data = await res.json();

        if (data.success) {
            window.location.href = '/login?success=password_reset';
        } else {
            errorEl.textContent = data.message || 'Reset failed. Please try again.';
            errorEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Set password';
        }
    } catch (err) {
        errorEl.textContent = 'Network error \u2014 please try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Set password';
    }
}
</script>

</body>
</html>
