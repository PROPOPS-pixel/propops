<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .brand-text { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- White background -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- ── House / Building mark (centered, 200px wide) ── -->
  <!-- Roof (triangle, navy) -->
  <polygon points="256,60 368,170 144,170" fill="#0f172a"/>
  <!-- Building body -->
  <rect x="156" y="168" width="200" height="148" fill="#0f172a"/>
  <!-- Left window (white) -->
  <rect x="178" y="192" width="56" height="46" rx="3" fill="#ffffff"/>
  <!-- Right window (amber — .Pro accent color) -->
  <rect x="278" y="192" width="56" height="46" rx="3" fill="#f59e0b"/>
  <!-- Door (white, centered) -->
  <rect x="218" y="242" width="44" height="74" rx="3" fill="#ffffff"/>
  <!-- Door knob (amber) -->
  <circle cx="257" cy="280" r="5" fill="#f59e0b"/>

  <!-- ── Wordmark (centered below house) ── -->
  <text
    x="256"
    y="388"
    class="brand-text"
    font-weight="800"
    font-size="72"
    text-anchor="middle"
    letter-spacing="-2">
    <tspan fill="#0f172a">PropOps</tspan><tspan fill="#f59e0b">.Pro</tspan>
  </text>

  <!-- Tagline -->
  <text
    x="256"
    y="434"
    class="brand-text"
    font-weight="500"
    font-size="22"
    fill="#94a3b8"
    text-anchor="middle"
    letter-spacing="2">PROPERTY OPERATIONS AI</text>
</svg>
